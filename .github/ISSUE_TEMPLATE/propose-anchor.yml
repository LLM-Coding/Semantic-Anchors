name: Propose New Semantic Anchor
description: Suggest a new semantic anchor for the catalog
title: "[Anchor Proposal]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a new semantic anchor!

        **Just name the term.** We test every proposal ourselves ([Anchor Prior Test](https://llm-coding.github.io/Semantic-Anchors/anchor-prior-test/)) and report back in this issue.

  - type: input
    id: term
    attributes:
      label: Proposed Term
      description: The term or phrase you want to propose
      placeholder: e.g., "SOLID Principles", "Behavior-Driven Development", "Domain-Driven Design"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context (Optional)
      description: A sentence or two on where or how you use it, or a link to a source
      placeholder: e.g., "I use it to ask for code reviews" or a link to a source
    validations:
      required: false
