name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: ./website
        run: npm ci

      - name: Run ESLint (website)
        working-directory: ./website
        run: npm run lint

      - name: Check Prettier formatting
        working-directory: ./website
        run: npm run format:check

      - name: Install scripts dependencies
        working-directory: ./scripts
        run: npm ci

      - name: Run ESLint (scripts)
        working-directory: ./scripts
        run: npm run lint

      - name: Check Prettier formatting (scripts)
        working-directory: ./scripts
        run: npm run format:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so extract-metadata can date each anchor (#652); a
          # shallow clone makes every anchor look newly added.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies (website)
        working-directory: ./website
        run: npm ci

      # Generated files (site data, llms.txt, all-anchors.adoc, ...) are not in
      # git. `npm test` in both packages regenerates them first (pretest), which
      # needs the scripts dependencies.
      - name: Install dependencies (scripts)
        working-directory: ./scripts
        run: npm ci

      - name: Run unit tests (website)
        working-directory: ./website
        run: npm test

      - name: Run unit tests (scripts)
        working-directory: ./scripts
        run: npm test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: ./website
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./website
        run: npx playwright install --with-deps chromium

      - name: Generate site data, llms.txt and all-anchors.adoc
        working-directory: ./scripts
        run: |
          npm ci
          npm run generate

      - name: Copy anchor files to public directory
        run: |
          mkdir -p website/public/docs
          cp -r docs/anchors website/public/docs/

      - name: Render documentation to HTML
        working-directory: ./scripts
        run: node render-docs.js

      - name: Run E2E tests
        working-directory: ./website
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 7

  dependency-check:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: ./website
        run: npm ci

      - name: Run security audit
        working-directory: ./website
        run: npm audit --audit-level=high

      - name: Run security audit (scripts)
        working-directory: ./scripts
        run: npm audit --audit-level=high

      - name: Run security audit (root)
        run: npm audit --audit-level=high
