name: AsciiDoc Linter

on:
  pull_request:
    paths:
      - 'docs/anchors/**/*.adoc'
  push:
    branches: [main]
    paths:
      - 'docs/anchors/**/*.adoc'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AsciiDoc Linter
        # Pinned to a commit on purpose. The linter has no releases, so an
        # unpinned install tracks its default branch: a rule change upstream
        # turns this repository red with no commit here. That happened on
        # 2026-09-24, when "fix rules that never fire through the CLI" made
        # dormant rules start reporting. Bump this SHA deliberately, and read
        # the new findings before you do.
        run: |
          pip install "git+https://github.com/doctoolchain/asciidoc-linter.git@ea57b29"

      - name: Run AsciiDoc Linter
        run: |
          echo "Linting AsciiDoc anchor files..."
          asciidoc-linter docs/anchors/*.adoc --format console --config .asciidoc-linter.yml

      - name: Summary
        if: success()
        run: |
          echo "✓ All anchor files passed AsciiDoc linter validation"
